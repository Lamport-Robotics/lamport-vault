[package]
name = "lamport-vault-svm-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "execute_direct on chain, in LiteSVM: the signature rides in the instruction data, which no test validator transaction can carry"

# Standalone on purpose: litesvm pulls its own solana crate set, which must not
# mix with the program workspace's.
[workspace]
resolver = "3"

# `succession`: the tests are built for the Heir-enabled program (docs/SUCCESSION.md): its program
# id, its version-3 vault, and the succession tests. Use it when the .so was built with the same
# feature: `anchor build -- --features succession`, then `cargo test --features succession`.
[features]
succession = []

# The tests sign thousands of LMS signatures and run the program in a VM: optimise the
# dependencies, as the program workspace does, and keep debug info for the tests themselves.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
litesvm = "=0.17.0"
solana-account = "4.3"
solana-address = "2.7"
solana-clock = "3.2"
solana-compute-budget-interface = "3.1"
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-sysvar = "4.2"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"
solana-transaction-error = "3.4"
sha2 = "0.10"
# Builders for Token-2022's extension instructions, for the transfer-hook and the succession token tests.
spl-token-2022-interface = "2.1"
spl-associated-token-account-interface = "2"
lamport-lms = { path = "../../programs/lms", features = ["sign"] }
