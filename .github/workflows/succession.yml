name: succession

# The vault's `succession` feature (Lamport Heir, docs/SUCCESSION.md) is extra code behind a cargo
# feature. Two things are checked here, with the image and solana-verify version verify.yml pins:
#
#   default build unchanged   on a pull request from a branch named succession*: the DEFAULT build
#                             of each program at the pull request is byte-for-byte the default
#                             build of its base. Whatever the feature adds, the vault without it
#                             is still the same program, and so is the registry. Other pull
#                             requests may change a program on purpose, so the job only runs for
#                             those branches.
#   succession build          the build WITH the feature: hash and size in the job summary, the
#                             .so as an artifact. It is a different program with its own id.

on:
  pull_request:
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/succession.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERIFY_VERSION: "0.5.2"
  # 2.3.13, pinned by digest (the same image as verify.yml).
  BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:0cf72459e089f3a928efd48b718d81817a8c1c380229edee2099dd651aaef3b9

jobs:
  unchanged:
    name: default build unchanged (${{ matrix.lib }})
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'succession')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lib: [lamport_vault, pq_registry]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LIB: ${{ matrix.lib }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the merge of the pull request into its base (what would land), and the base itself
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable

      - name: Cache solana-verify
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked solana-verify --version "$SOLANA_VERIFY_VERSION"

      - name: Build the pull request, default features
        run: |
          solana-verify build --library-name "$LIB" --base-image "$BASE_IMAGE"
          cp "target/deploy/$LIB.so" "$RUNNER_TEMP/head.so"

      - name: Build the base, default features
        run: |
          # from nothing: no artifact of the first build may stand in for the second
          sudo rm -rf target
          git checkout --quiet "$BASE_SHA"
          solana-verify build --library-name "$LIB" --base-image "$BASE_IMAGE"
          cp "target/deploy/$LIB.so" "$RUNNER_TEMP/base.so"

      - name: Compare
        run: |
          base_hash=$(solana-verify get-executable-hash "$RUNNER_TEMP/base.so" | tail -n1)
          head_hash=$(solana-verify get-executable-hash "$RUNNER_TEMP/head.so" | tail -n1)
          {
            echo "### $LIB, default features"
            echo
            echo '```'
            echo "base  $BASE_SHA  $base_hash  $(wc -c < "$RUNNER_TEMP/base.so") bytes"
            echo "head  $GITHUB_SHA  $head_hash  $(wc -c < "$RUNNER_TEMP/head.so") bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base $base_hash"
          echo "head $head_hash"
          if ! cmp "$RUNNER_TEMP/base.so" "$RUNNER_TEMP/head.so"; then
            echo "DIFFERENT: this pull request changes the default build of $LIB" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "A line added above existing code is enough: see docs/SUCCESSION.md." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "IDENTICAL" | tee -a "$GITHUB_STEP_SUMMARY"

  succession-build:
    name: succession build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable

      - name: Cache solana-verify
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked solana-verify --version "$SOLANA_VERIFY_VERSION"

      - name: Build lamport_vault with --features succession
        run: solana-verify build --library-name lamport_vault --base-image "$BASE_IMAGE" -- --features succession

      - name: Hash
        run: |
          so=target/deploy/lamport_vault.so
          hash=$(solana-verify get-executable-hash "$so" | tail -n1)
          {
            echo "### lamport_vault, --features succession"
            echo
            echo '```'
            echo "commit   $GITHUB_SHA"
            echo "hash     $hash"
            echo "size     $(wc -c < "$so") bytes"
            echo "image    $BASE_IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "lamport_vault (succession) $hash"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lamport_vault-succession-${{ github.sha }}
          path: target/deploy/lamport_vault.so
          if-no-files-found: error
