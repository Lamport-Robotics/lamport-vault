name: test

# Host-side tests: the Rust crates (LMS vectors, program unit + encoding
# tests) and the SDK. The anchor localnet suite (tests/*.ts), which needs a
# validator and real signatures, runs in anchor.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # Twice: as always, and with the vault's `succession` feature (docs/SUCCESSION.md). The default
    # leg keeps the name `rust`, which branch protection requires.
    name: rust${{ matrix.succession && ' (succession)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        succession: [false, true]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10, toolchain: stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.succession && 'succession' || 'default' }}
      - run: cargo test --workspace --features lamport-lms/sign${{ matrix.succession && ',lamport-vault/succession' || '' }} --locked
      # `short-clocks` is the succession build in which a day lasts one second, for devnet tests
      # (docs/SUCCESSION.md). The same rules have to hold in it.
      - if: matrix.succession
        run: cargo test --workspace --features lamport-lms/sign,lamport-vault/short-clocks --locked
      # A mainnet build differs from these in the program id and in nothing else (docs/VERIFY.md).
      # The id is what keeps a devnet signature from being a mainnet one, so the test that says
      # which id a build carries is run on the mainnet side too.
      - name: The mainnet builds carry the mainnet ids
        run: cargo test -p lamport-vault -p pq-registry --test program_id --features lamport-vault/mainnet,pq-registry/mainnet${{ matrix.succession && ',lamport-vault/succession' || '' }} --locked
      - name: A mainnet build is never a test build
        if: matrix.succession
        run: |
          refuse() {
            if cargo check "$@" --locked 2>/dev/null; then echo "built, and must not: $*"; exit 1; fi
          }
          refuse -p lamport-vault --features lamport-vault/mainnet,lamport-vault/short-clocks
          refuse -p lamport-vault --features lamport-vault/mainnet,lamport-vault/small-history
          refuse -p pq-registry --features pq-registry/mainnet,pq-registry/small-history

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    # The vault page and the single-file cold signer. The signer's sha256 printed here is the
    # number docs/VERIFY.md asks you to compare with the file you downloaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run build
        working-directory: sdk
      - run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build
        working-directory: web
      # The page and the signer have a second build, for vaults of the Heir-enabled program
      # (docs/SUCCESSION.md, section 9). Its code sits in the same source behind a build constant,
      # and the vault's own files must come out without any of it. The page already carries the
      # SDK's encoder for the sixth action; the signer, which sees the 24 words, carries nothing.
      - name: The vault's page and signer carry no Heir code
        working-directory: web
        run: |
          heir_id=$(grep -o 'LAMPORT_VAULT_HEIR_PROGRAM_ID = new PublicKey("[^"]*' ../sdk/packages/vault/src/succession.ts | cut -d'"' -f2)
          test -n "$heir_id"
          fail=0
          for word in "inheritance plan" "who that is" "/heir/signer.html"; do
            if grep -rqF -- "$word" dist; then echo "::error::\"$word\" is in the vault's own build: $(grep -rlF -- "$word" dist | tr '\n' ' ')"; fail=1; fi
          done
          for word in SetSuccession "$heir_id"; do
            if grep -qF -- "$word" dist/signer.html; then echo "::error::\"$word\" is in the vault's cold signer"; fail=1; fi
          done
          [ "$fail" = 0 ] && echo "none of it is in dist/"
          exit "$fail"
      - name: Signer hash
        working-directory: web
        run: |
          hash=$(sha256sum dist/signer.html | cut -d" " -f1)
          {
            echo "### cold signer"
            echo
            echo '```'
            echo "commit   $GITHUB_SHA"
            echo "sha256   $hash"
            echo "size     $(wc -c < dist/signer.html) bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "signer.html $hash"
      - name: Heir build of the page and the signer
        working-directory: web
        run: |
          npm run build:heir
          grep -qF SetSuccession dist-heir/signer.html
          hash=$(sha256sum dist-heir/signer.html | cut -d" " -f1)
          {
            echo "### cold signer, Heir build"
            echo
            echo '```'
            echo "commit   $GITHUB_SHA"
            echo "sha256   $hash"
            echo "size     $(wc -c < dist-heir/signer.html) bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "heir signer.html $hash"
      # The same two builds for mainnet: the mainnet program ids, the mainnet genesis hash in every
      # key derivation, and a page that may talk to mainnet only (web/cluster.config.ts).
      - name: Mainnet builds of the page and the signer
        working-directory: web
        run: |
          npm run build:mainnet
          npm run build:heir:mainnet
          grep -qF 7EiE5pRP5byrY7mzvUBfXS2UD8GwGtPhbGne6D1BTR5H dist-mainnet/signer.html
          grep -qF 3XsnTrQJ5XmFyEyVauMmMseHph4wXkn6QWUZCRPjuEEX dist-heir-mainnet/signer.html
          grep -qF SetSuccession dist-heir-mainnet/signer.html
          for page in dist-mainnet/index.html dist-heir-mainnet/index.html; do
            grep -qF "https://api.mainnet-beta.solana.com" "$page"
            if grep -qF "api.devnet.solana.com" "$page"; then echo "$page names a devnet endpoint"; exit 1; fi
          done
          # and the devnet builds made above are still devnet builds
          if grep -qF "this is the mainnet signer" dist/signer.html dist-heir/signer.html; then echo "a devnet signer was built as a mainnet one"; exit 1; fi
          for f in dist-mainnet/signer.html dist-heir-mainnet/signer.html; do
            hash=$(sha256sum "$f" | cut -d" " -f1)
            {
              echo "### cold signer, $f"
              echo
              echo '```'
              echo "commit   $GITHUB_SHA"
              echo "sha256   $hash"
              echo "size     $(wc -c < "$f") bytes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$f $hash"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.sha }}
          path: |
            web/dist
            web/dist-heir
            web/dist-mainnet
            web/dist-heir-mainnet
          if-no-files-found: error
